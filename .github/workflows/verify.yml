name: Verify portfolio agent

on:
  push:
  pull_request:

jobs:
  local-checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned dependencies
        run: python setup_project.py
      - name: Test and evaluate without an API key
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            PYTHON=.venv/Scripts/python.exe
          else
            PYTHON=.venv/bin/python
          fi
          "$PYTHON" -m pip check
          "$PYTHON" -m pytest -q
          "$PYTHON" evaluate.py --output reports/ci-evaluation.json
          "$PYTHON" evaluate.py --cases tests/shardul_extra_questions.json --output reports/ci-comparison.json
          "$PYTHON" evaluate.py --cases tests/holdout_questions.json --output reports/ci-additional.json
      - name: Keep evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-evaluation-${{ matrix.os }}-py${{ matrix.python-version }}
          path: reports/ci-*.json
          if-no-files-found: ignore
